<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF Viewer — L'auxiliaire</title>
    <link rel="stylesheet" href="vendor/pdf_viewer.css" />
    <link rel="stylesheet" href="../content/popup.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="prevPage" title="Previous page">‹</button>
      <span class="fla-pdf-pageinfo">
        <input id="pageNum" type="number" min="1" value="1" />
        <span>/ <span id="pageCount">–</span></span>
      </span>
      <button id="nextPage" title="Next page">›</button>
      <span class="fla-pdf-spacer"></span>
      <button id="zoomOut" title="Zoom out">−</button>
      <span id="zoomLevel">125%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <span class="fla-pdf-spacer"></span>
      <span id="docTitle" class="fla-pdf-title"></span>
    </div>
    <div id="viewerContainer"></div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
