<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>L'auxiliaire</h1>

    <section class="toggles">
      <p class="hint">Click any word, or select a phrase, to translate it.</p>
      <label class="row">
        <span>Hover-to-translate</span>
        <input type="checkbox" id="hoverToggle" />
      </label>
      <label class="row">
        <span>Slower speech</span>
        <input type="checkbox" id="slowSpeech" />
      </label>
      <label class="row">
        <span>Appearance</span>
        <select id="themeMode">
          <option value="system">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </section>

    <section class="reading-aids">
      <label class="row">
        <span>Gender / plural color coding
          <span class="info" tabindex="0" role="note" aria-label="Web pages only — the PDF viewer doesn't colour words yet. Click-to-translate, saving and conjugation all work there as normal." title="Web pages only — the PDF viewer doesn't colour words yet. Click-to-translate, saving and conjugation all work there as normal.">i</span>
        </span>
        <input type="checkbox" id="colorCodingToggle" />
      </label>
      <p class="hint hint--sub">Applies to web pages. Not available in the PDF viewer yet.</p>
      <label class="row">
        <span>Masculine</span>
        <span class="controls">
          <input type="checkbox" id="catMasculineToggle" title="Show masculine highlighting" />
          <input type="color" id="colorMasculine" />
        </span>
      </label>
      <label class="row">
        <span>Feminine</span>
        <span class="controls">
          <input type="checkbox" id="catFeminineToggle" title="Show feminine highlighting" />
          <input type="color" id="colorFeminine" />
        </span>
      </label>
      <label class="row">
        <span>Plural</span>
        <span class="controls">
          <input type="checkbox" id="catPluralToggle" title="Show plural highlighting" />
          <input type="color" id="colorPlural" />
        </span>
      </label>
      <label class="row">
        <span>Neutral</span>
        <span class="controls">
          <input type="checkbox" id="catNeutralToggle" title="Show neutral highlighting" />
          <input type="color" id="colorNeutral" />
        </span>
      </label>
      <div class="row">
        <span>Reading level</span>
        <span id="readingLevel">—</span>
      </div>
    </section>

    <section class="pdf">
      <input type="file" id="pdfFileInput" accept="application/pdf" hidden />
      <button id="openPdfFile">📄 Open a PDF</button>
      <button id="reopenPdf" hidden>Reopen this PDF in workbook viewer</button>
      <p id="pdfError" class="hint" hidden></p>
    </section>

    <section class="actions">
      <button id="openSidepanel">Open workbook</button>
    </section>

    <section class="tutorial">
      <div class="row">
        <span>Tutorial</span>
        <button id="replayTour" class="link-btn" type="button">Replay</button>
      </div>
    </section>

    <section class="shortcuts">
      <h2 class="section-title">Shortcuts</h2>
      <ul class="shortcut-list">
        <li>
          <span class="keys"><kbd>Alt</kbd><kbd>T</kbd></span>
          <span>Toggle hover-to-translate</span>
        </li>
        <li>
          <span class="keys"><kbd>Alt</kbd><kbd>R</kbd></span>
          <span>Read the selection aloud</span>
        </li>
        <li>
          <span class="keys"><kbd>Alt</kbd><kbd>S</kbd></span>
          <span>Translate &amp; save the selection</span>
        </li>
      </ul>
      <button id="editShortcuts" class="link-btn">Change these keys</button>
    </section>


    <script type="module" src="popup.js"></script>
  </body>
</html>
